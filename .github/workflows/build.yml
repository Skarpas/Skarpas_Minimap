name: Build EXE

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Compilar EXE
        run: pyinstaller "Skarpas Minimap v1.0.spec"

      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>$null; $true
          git tag -f latest
          git push -f origin latest
          gh release create latest "dist/Skarpas Minimap v1.0.exe" --title "Ultima version" --notes "Compilado automaticamente al subir cambios."
