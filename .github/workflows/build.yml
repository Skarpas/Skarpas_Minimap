name: Build EXE

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Compilar EXE
        run: pyinstaller "Skarpas Minimap v1.0.spec"

      - name: Publicar release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Ultima version
          body: Compilado automaticamente al subir cambios.
          artifacts: "dist/Skarpas Minimap v1.0.exe"
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
